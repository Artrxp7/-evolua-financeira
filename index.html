<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evolua sua Vida Financeira</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#17202a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Evolua"><link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header><div><h1>Evolua sua Vida Financeira</h1><p>Seu dinheiro, seus objetivos, sua evolução.</p></div><button id="reset">↻</button></header>
<main>
<section class="cards">
<div class="card"><span>Saldo</span><strong id="balance">R$ 0,00</strong></div>
<div class="card"><span>Receitas</span><strong id="income">R$ 0,00</strong></div>
<div class="card"><span>Gastos</span><strong id="expense">R$ 0,00</strong></div>
</section>
<section class="panel">
<h2>Adicionar movimentação</h2>
<div class="form">
<select id="type"><option value="income">Receita</option><option value="expense">Gasto</option></select>
<input id="description" placeholder="Descrição">
<input id="amount" type="number" step="0.01" placeholder="Valor">
<button id="add">Adicionar</button>
</div>
</section>
<section class="panel">
<div class="panel-title"><h2>Movimentações</h2><button class="small" id="clear">Limpar</button></div>
<div id="transactions" class="list"></div>
</section>
<section class="panel">
<h2>🎯 Meta financeira</h2>
<div class="form">
<input id="goalName" placeholder="Ex.: Guardar para um celular">
<input id="goalTarget" type="number" step="0.01" placeholder="Valor da meta">
<input id="goalSaved" type="number" step="0.01" placeholder="Quanto já tenho">
<button id="saveGoal">Salvar meta</button>
</div>
<div id="goal"></div>
</section>
</main>
<nav><button class="active">Início</button><button onclick="document.getElementById('description').focus()">+ Movimento</button><button onclick="document.getElementById('goalName').focus()">🎯 Meta</button></nav>
</div>
<script src="app.js"></script><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js")}</script>
</body></html>
